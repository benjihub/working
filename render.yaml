services:
	- type: web
		name: casino-chat-buddy
		env: node
		plan: free
		buildCommand: npm install
		startCommand: node server.js
		autoDeploy: true
    
		# Render provides PORT automatically; server reads process.env.PORT
		envVars:
			# LiveChat authentication: prefer Personal Access Token (PAT) via Basic auth
			- key: LIVECHAT_PAT
				sync: false
			# Optional: OAuth Bearer token (authorization code flow only). Not required when using PAT.
			- key: LIVECHAT_ACCESS_TOKEN
				sync: false
			# Webhook config: point this to your Render URL + /livechat/webhook
			- key: LIVECHAT_WEBHOOK_URL
				sync: false
			- key: LIVECHAT_WEBHOOK_SECRET
				sync: false
			# Your app/client identifier (any string you use when registering the webhook)
			- key: LIVECHAT_CLIENT_ID
				sync: false
			# Optional bot protections
			- key: LIVECHAT_REPLY_COOLDOWN_MS
				value: "5000"
			- key: BOT_SECRET
				sync: false
			# AI controls (disable by default on Render)
			- key: USE_OPENAI
				value: "false"
			- key: OPENAI_API_KEY
				sync: false

